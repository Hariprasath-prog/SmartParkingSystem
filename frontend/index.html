<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idam Nagar Smart Parking Authority — Urban Mobility Portal</title>
    <meta name="description" content="Official Smart Parking Allocation System for Idam Nagar Commercial District. Multi-facility real-time parking allocation powered by Dijkstra shortest path routing and deterministic queue prioritization." />
    <meta name="theme-color" content="#0a0f1d" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230284c7'/><text x='16' y='22' font-family='sans-serif' font-weight='bold' font-size='18' text-anchor='middle' fill='white'>P</text></svg>" />
</head>
<body>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- Application Shell -->
<div class="app-shell">

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">

        <!-- Brand Header -->
        <div class="sidebar-header">
            <div class="sidebar-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="4" />
                    <path d="M9 16V8h4.5a3 3 0 0 1 0 6H9" />
                </svg>
            </div>
            <div class="sidebar-brand">
                <h2>IN-SPA MOBILITY</h2>
                <p>Idam Nagar Authority</p>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidebar-nav" role="list">
            <div class="nav-section-label">Operations</div>

            <a class="nav-item active" data-page="dashboard" role="listitem" href="#dashboard">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span>Live Dashboard</span>
            </a>

            <a class="nav-item" data-page="find-parking" role="listitem" href="#find-parking">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>Find &amp; Book Parking</span>
            </a>

            <a class="nav-item" data-page="parking-layout" role="listitem" href="#parking-layout">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                <span>Parking Bay Grid</span>
            </a>

            <a class="nav-item" data-page="bookings" role="listitem" href="#bookings">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span>My Bookings</span>
            </a>

            <div class="nav-section-label" style="margin-top: 1rem">Control &amp; Governance</div>

            <a class="nav-item" data-page="admin" role="listitem" href="#admin">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <span>Transit Management</span>
            </a>
        </nav>

        <!-- Sidebar Footer: Simulated Time Display -->
        <div class="sidebar-footer">
            <div class="sim-time-badge">
                <div class="sim-clock-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <div>
                    <div class="sim-time-label">Network Simulated Clock</div>
                    <div class="sim-time-value" id="sim-time-display">08:00</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">

        <!-- Header -->
        <header class="top-header" role="banner">
            <div class="header-left">
                <button class="header-mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">
                    <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>

                <div class="header-breadcrumb">
                    <h1 id="page-title">Live Dashboard</h1>
                    <p id="page-subtitle">Idam Nagar Commercial District Transit Authority</p>
                </div>
            </div>

            <div class="header-actions">
                <!-- Quick Time Advancement Buttons (Fast Testing of 20-min Timeout) -->
                <div class="clock-quick-advance" title="Advance simulated clock to test 20-min timeouts">
                    <span class="clock-quick-label">Clock:</span>
                    <button class="clock-quick-btn" onclick="quickAdvanceClock(15)">+15m</button>
                    <button class="clock-quick-btn" onclick="quickAdvanceClock(20)">+20m</button>
                    <button class="clock-quick-btn" onclick="quickAdvanceClock(60)">+1h</button>
                </div>

                <button class="btn btn-primary btn-sm" onclick="navigateTo('find-parking')" id="quick-book-btn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>Book Parking Space</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="page-content" role="main">

            <!-- PAGE: DASHBOARD -->
            <section id="page-dashboard" class="page active" aria-labelledby="page-title">
                <div id="dashboard-content">
                    <div class="loading-spinner"><div class="spinner"></div></div>
                </div>
            </section>

            <!-- PAGE: FIND PARKING -->
            <section id="page-find-parking" class="page" aria-labelledby="page-title">
                <div id="find-parking-content">
                    <div class="loading-spinner"><div class="spinner"></div></div>
                </div>
            </section>

            <!-- PAGE: PARKING LAYOUT (20 BAYS PER LOT) -->
            <section id="page-parking-layout" class="page" aria-labelledby="page-title">
                <div id="parking-layout-content">
                    <div class="loading-spinner"><div class="spinner"></div></div>
                </div>
            </section>

            <!-- PAGE: MY BOOKINGS -->
            <section id="page-bookings" class="page" aria-labelledby="page-title">
                <div id="bookings-content">
                    <div class="loading-spinner"><div class="spinner"></div></div>
                </div>
            </section>

            <!-- PAGE: ADMIN CONTROL -->
            <section id="page-admin" class="page" aria-labelledby="page-title">
                <div id="admin-content">
                    <div class="loading-spinner"><div class="spinner"></div></div>
                </div>
            </section>

        </main>
    </div>
</div>

<!-- Global Confirmation Modal -->
<div class="modal-overlay" id="booking-action-modal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="action-modal-title">Confirm Action</div>
            <button class="modal-close" onclick="closeModal('booking-action-modal')" aria-label="Close">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body" id="action-modal-body"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('booking-action-modal')">Dismiss</button>
            <button class="btn btn-primary" id="action-modal-confirm">Confirm</button>
        </div>
    </div>
</div>

<!-- Space Detail Modal -->
<div class="modal-overlay" id="space-detail-modal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="space-modal-title">Stall Details</div>
            <button class="modal-close" onclick="closeModal('space-detail-modal')">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body" id="space-modal-body"></div>
    </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/validation.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/parking.js"></script>
<script src="js/bookings.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
