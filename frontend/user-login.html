<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citizen &amp; Driver Portal — Idam Nagar Smart Parking Authority</title>
    <meta name="description" content="Driver sign in and account registration for Idam Nagar Smart Parking Allocation System." />
    <meta name="theme-color" content="#070b14" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/auth.css" />

    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2310b981'/><text x='16' y='22' font-family='sans-serif' font-weight='bold' font-size='18' text-anchor='middle' fill='white'>P</text></svg>" />

    <style>
        :root {
            --theme-accent: #10b981;
            --theme-glow: rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body class="auth-body">

    <!-- Ambient Lighting & Transit Pattern Background -->
    <div class="auth-bg-mesh" aria-hidden="true">
        <div class="auth-mesh-blob blob-user-1"></div>
        <div class="auth-mesh-blob blob-user-2"></div>
    </div>
    <div class="auth-grid-overlay" aria-hidden="true"></div>

    <div class="auth-container wide">
        <div class="auth-card">

            <!-- Card Header -->
            <div class="auth-header">
                <div class="auth-badge user">
                    <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.5">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    <span>Citizen &amp; Commuter Mobility</span>
                </div>

                <div class="auth-logo user">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="4" />
                        <path d="M9 16V8h4.5a3 3 0 0 1 0 6H9" />
                    </svg>
                </div>

                <h1 class="auth-title" id="portal-title">Driver Sign In</h1>
                <p class="auth-subtitle" id="portal-subtitle">Access real-time parking allocation, bay routing &amp; reservations</p>
            </div>

            <!-- Tab Switcher: Sign In vs Register -->
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab-btn active" id="tab-login" role="tab" aria-selected="true">
                    Sign In
                </button>
                <button type="button" class="auth-tab-btn" id="tab-register" role="tab" aria-selected="false">
                    Register New Driver
                </button>
            </div>

            <!-- Alert Box -->
            <div id="auth-alert" class="auth-alert error" role="alert">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="auth-alert-text">Error message</span>
            </div>

            <!-- ========================================================= -->
            <!-- 1. SIGN IN FORM -->
            <!-- ========================================================= -->
            <form id="user-login-form" class="auth-form" novalidate>

                <!-- Username Field -->
                <div class="form-group">
                    <label class="form-label" for="user-username">
                        Username <span class="required">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            type="text"
                            id="user-username"
                            name="username"
                            class="auth-input mono"
                            placeholder="e.g. johndoe"
                            autocomplete="username"
                            required
                            autofocus
                        />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label" for="user-password">
                        Password <span class="required">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input
                            type="password"
                            id="user-password"
                            name="password"
                            class="auth-input has-toggle mono"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        />
                        <button
                            type="button"
                            class="password-toggle"
                            id="toggle-user-password"
                            aria-label="Toggle password visibility"
                        >
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.25rem">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" id="user-remember" checked />
                        <span>Keep me signed in on this device</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn-primary user" id="login-submit-btn">
                    <span id="login-btn-text">Sign In &amp; Find Parking</span>
                    <div id="login-spinner" class="btn-spinner" style="display:none"></div>
                </button>

            </form>

            <!-- ========================================================= -->
            <!-- 2. REGISTRATION FORM (HIDDEN BY DEFAULT) -->
            <!-- ========================================================= -->
            <form id="user-register-form" class="auth-form" style="display:none" novalidate>

                <div class="form-row">
                    <!-- Username -->
                    <div class="form-group">
                        <label class="form-label" for="reg-username">
                            Username <span class="required">*</span>
                        </label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input
                                type="text"
                                id="reg-username"
                                class="auth-input mono"
                                placeholder="e.g. driver99"
                                autocomplete="off"
                                required
                            />
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label" for="reg-password">
                            Password <span class="required">*</span>
                        </label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input
                                type="password"
                                id="reg-password"
                                class="auth-input mono"
                                placeholder="Min 4 characters"
                                autocomplete="off"
                                required
                            />
                        </div>
                    </div>
                </div>

                <!-- Driver Full Name -->
                <div class="form-group">
                    <label class="form-label" for="reg-name">
                        Driver Full Name <span class="required">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="7" r="4"/>
                            <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
                        </svg>
                        <input
                            type="text"
                            id="reg-name"
                            class="auth-input"
                            placeholder="e.g. Rajesh Kumar"
                            autocomplete="name"
                            required
                        />
                    </div>
                </div>

                <div class="form-row">
                    <!-- Vehicle License Plate -->
                    <div class="form-group">
                        <label class="form-label" for="reg-vehicle-id">
                            Vehicle Plate Number <span class="required">*</span>
                        </label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <rect x="2" y="5" width="20" height="14" rx="2"/>
                                <line x1="2" y1="10" x2="22" y2="10"/>
                            </svg>
                            <input
                                type="text"
                                id="reg-vehicle-id"
                                class="auth-input mono"
                                placeholder="TN-01-AB-1234"
                                style="text-transform:uppercase"
                                required
                            />
                        </div>
                    </div>

                    <!-- Vehicle Type -->
                    <div class="form-group">
                        <label class="form-label" for="reg-vehicle-type">
                            Classification <span class="required">*</span>
                        </label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <circle cx="7" cy="17" r="2"/>
                                <circle cx="17" cy="17" r="2"/>
                                <path d="M5 17h14v-6l-3-4H8L5 11v6z"/>
                            </svg>
                            <select id="reg-vehicle-type" class="auth-input" style="padding-left: 2.45rem" required>
                                <option value="CAR">Passenger Car (4-Wheeler)</option>
                                <option value="TWO_WHEELER">Two-Wheeler / Scooter</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Accessible Permit -->
                <div class="form-group">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" id="reg-accessible" />
                        <span>I hold an Authorized Accessible / Disability Parking Permit</span>
                    </label>
                </div>

                <!-- Register Button -->
                <button type="submit" class="auth-btn-primary user" id="reg-submit-btn">
                    <span id="reg-btn-text">Create Account &amp; Sign In</span>
                    <div id="reg-spinner" class="btn-spinner" style="display:none"></div>
                </button>

            </form>

            <!-- Switch to Admin Portal Link -->
            <div class="auth-footer">
                <span>Are you municipal transit staff or authority?</span><br/>
                <a href="admin-login.html" class="auth-link" style="margin-top:0.4rem">
                    <span>Switch to Administrator Gateway</span>
                    <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </a>
            </div>

            <!-- Authority Identifier Footer -->
            <div class="auth-system-info">
                IDAM NAGAR URBAN MOBILITY &bull; CITIZEN TRANSIT SYSTEM
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const loginForm = document.getElementById('user-login-form');
            const registerForm = document.getElementById('user-register-form');
            const alertBox = document.getElementById('auth-alert');
            const alertText = document.getElementById('auth-alert-text');
            const portalTitle = document.getElementById('portal-title');
            const portalSubtitle = document.getElementById('portal-subtitle');

            const togglePasswordBtn = document.getElementById('toggle-user-password');
            const passwordInput = document.getElementById('user-password');

            // Password Toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.innerHTML = isPassword
                    ? `<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                    : `<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            });

            // Tab Switching
            tabLogin.addEventListener('click', () => {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginForm.style.display = 'flex';
                registerForm.style.display = 'none';
                portalTitle.textContent = 'Driver Sign In';
                portalSubtitle.textContent = 'Access real-time parking allocation, bay routing & reservations';
                alertBox.classList.remove('show');
            });

            tabRegister.addEventListener('click', () => {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                loginForm.style.display = 'none';
                registerForm.style.display = 'flex';
                portalTitle.textContent = 'Register Vehicle & Driver';
                portalSubtitle.textContent = 'Enroll your vehicle profile for instant 1-click bay booking';
                alertBox.classList.remove('show');
            });

            // Login Handler
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                alertBox.classList.remove('show');

                const username = document.getElementById('user-username').value.trim();
                const password = document.getElementById('user-password').value.trim();

                if (!username) {
                    showAlert('Please enter your driver username.', 'error');
                    document.getElementById('user-username').focus();
                    return;
                }

                if (!password) {
                    showAlert('Please enter your password.', 'error');
                    document.getElementById('user-password').focus();
                    return;
                }

                const submitBtn = document.getElementById('login-submit-btn');
                const btnText = document.getElementById('login-btn-text');
                const spinner = document.getElementById('login-spinner');

                submitBtn.disabled = true;
                btnText.textContent = 'Validating Account...';
                spinner.style.display = 'block';

                setTimeout(() => {
                    const result = Auth.loginUser(username, password);

                    if (result.success) {
                        btnText.textContent = 'Success! Redirecting...';
                        window.location.href = result.redirect || 'index.html#find-parking';
                    } else {
                        submitBtn.disabled = false;
                        btnText.textContent = 'Sign In & Find Parking';
                        spinner.style.display = 'none';
                        showAlert(result.message, 'error');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }, 350);
            });

            // Registration Handler
            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                alertBox.classList.remove('show');

                const data = {
                    username: document.getElementById('reg-username').value.trim(),
                    password: document.getElementById('reg-password').value.trim(),
                    name: document.getElementById('reg-name').value.trim(),
                    vehicleId: document.getElementById('reg-vehicle-id').value.trim().toUpperCase(),
                    vehicleType: document.getElementById('reg-vehicle-type').value,
                    accessiblePermit: document.getElementById('reg-accessible').checked
                };

                const submitBtn = document.getElementById('reg-submit-btn');
                const btnText = document.getElementById('reg-btn-text');
                const spinner = document.getElementById('reg-spinner');

                submitBtn.disabled = true;
                btnText.textContent = 'Creating Account...';
                spinner.style.display = 'block';

                setTimeout(() => {
                    const res = Auth.registerUser(data);
                    submitBtn.disabled = false;
                    btnText.textContent = 'Create Account & Sign In';
                    spinner.style.display = 'none';

                    if (res.success) {
                        // Automatically sign in the user
                        Auth.loginUser(data.username, data.password);
                        showAlert('Account registered successfully! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html#find-parking';
                        }, 500);
                    } else {
                        showAlert(res.message, 'error');
                    }
                }, 400);
            });

            function showAlert(msg, type = 'error') {
                alertText.textContent = msg;
                alertBox.className = `auth-alert ${type} show`;
            }
        });
    </script>
</body>
</html>
