<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Gateway — Idam Nagar Smart Parking Authority</title>
    <meta name="description" content="Official Administrative Access Gateway for Idam Nagar Smart Parking Authority and Transit Dispatchers." />
    <meta name="theme-color" content="#070b14" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/auth.css" />

    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230284c7'/><text x='16' y='22' font-family='sans-serif' font-weight='bold' font-size='18' text-anchor='middle' fill='white'>A</text></svg>" />

    <style>
        :root {
            --theme-accent: #0284c7;
            --theme-glow: rgba(2, 132, 199, 0.25);
        }
    </style>
</head>
<body class="auth-body">

    <!-- Ambient Lighting & Transit Pattern Background -->
    <div class="auth-bg-mesh" aria-hidden="true">
        <div class="auth-mesh-blob blob-admin-1"></div>
        <div class="auth-mesh-blob blob-admin-2"></div>
    </div>
    <div class="auth-grid-overlay" aria-hidden="true"></div>

    <div class="auth-container">
        <div class="auth-card">

            <!-- Card Header -->
            <div class="auth-header">
                <div class="auth-badge admin">
                    <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.5">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Municipal Command Gateway</span>
                </div>

                <div class="auth-logo admin">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="4" />
                        <path d="M9 16V8h4.5a3 3 0 0 1 0 6H9" />
                    </svg>
                </div>

                <h1 class="auth-title">Authority Staff Sign In</h1>
                <p class="auth-subtitle">Transit Operations &amp; Facility Administration Portal</p>
            </div>

            <!-- Error / Success Alert Box -->
            <div id="login-alert" class="auth-alert error" role="alert">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="login-alert-text">Invalid administrative credentials.</span>
            </div>

            <!-- Strict Login Form -->
            <form id="admin-login-form" class="auth-form" novalidate>

                <!-- Username Field -->
                <div class="form-group">
                    <label class="form-label" for="admin-username">
                        Official Username <span class="required">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            type="text"
                            id="admin-username"
                            name="username"
                            class="auth-input mono"
                            placeholder="e.g. admin"
                            autocomplete="username"
                            required
                            autofocus
                        />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label" for="admin-password">
                        Security Password <span class="required">*</span>
                    </label>
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input
                            type="password"
                            id="admin-password"
                            name="password"
                            class="auth-input has-toggle mono"
                            placeholder="Enter administrative password"
                            autocomplete="current-password"
                            required
                        />
                        <button
                            type="button"
                            class="password-toggle"
                            id="toggle-password"
                            aria-label="Toggle password visibility"
                        >
                            <svg id="eye-icon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.25rem">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" id="remember-device" checked />
                        <span>Keep administrative session active</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn-primary admin" id="submit-btn">
                    <span id="btn-text">Authenticate &amp; Access Console</span>
                    <div id="btn-spinner" class="btn-spinner" style="display:none"></div>
                </button>

            </form>

            <!-- Switch to Driver Portal Link -->
            <div class="auth-footer">
                <span>Are you a citizen commuter or driver?</span><br/>
                <a href="user-login.html" class="auth-link" style="margin-top:0.4rem">
                    <span>Switch to Citizen &amp; Driver Portal</span>
                    <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </a>
            </div>

            <!-- Authority Identifier Footer -->
            <div class="auth-system-info">
                IDAM NAGAR URBAN MOBILITY &bull; DISPATCH GATEWAY SECURE
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('admin-login-form');
            const usernameInput = document.getElementById('admin-username');
            const passwordInput = document.getElementById('admin-password');
            const alertBox = document.getElementById('login-alert');
            const alertText = document.getElementById('login-alert-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const togglePasswordBtn = document.getElementById('toggle-password');

            // Password reveal toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.innerHTML = isPassword
                    ? `<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                    : `<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            });

            // Form Submit Handler
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alertBox.classList.remove('show');

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username) {
                    showAlert('Please enter your official administrator username.');
                    usernameInput.focus();
                    return;
                }

                if (!password) {
                    showAlert('Please enter your security password.');
                    passwordInput.focus();
                    return;
                }

                // Loading animation
                submitBtn.disabled = true;
                btnText.textContent = 'Verifying Credentials...';
                btnSpinner.style.display = 'block';

                setTimeout(() => {
                    const result = Auth.loginAdmin(username, password);

                    if (result.success) {
                        btnText.textContent = 'Authenticated. Redirecting...';
                        window.location.href = result.redirect || 'index.html#admin';
                    } else {
                        submitBtn.disabled = false;
                        btnText.textContent = 'Authenticate & Access Console';
                        btnSpinner.style.display = 'none';
                        showAlert(result.message || 'Access Denied: Invalid administrator credentials.');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }, 350);
            });

            function showAlert(msg) {
                alertText.textContent = msg;
                alertBox.classList.add('show');
            }
        });
    </script>
</body>
</html>
